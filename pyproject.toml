[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de cotação de seguro auto para o desafio FDE Namastex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", "web", "ai-logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# tabelas de regex e texto de resposta: quebrar linha piora a leitura
"agent/guards/gates.py" = ["E501"]
"agent/handoff.py" = ["E501"]
"agent/llm.py" = ["E501"]
"agent/router.py" = ["E501"]
"evals/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["agent", "evals", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["vendor", "web"]
